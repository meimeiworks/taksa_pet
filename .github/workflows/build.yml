name: Build MeiMeiPET EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PySide6 pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name "MeiMeiPET" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MeiMeiPET-Windows
          path: dist/MeiMeiPET.exe
